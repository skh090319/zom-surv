<!doctype html><html lang="ko"><head><meta charset="utf-8"><base href="../"><title>Oblivion calamity review</title><link rel="stylesheet" href="style.css"><style>html,body{height:auto;overflow:auto}body{margin:0;background:#10070c;color:#ffe1e9;font:13px system-ui}header{display:flex;flex-wrap:wrap;gap:6px;padding:8px}button{padding:8px 12px;background:#260f18;color:#ffe7ef;border:1px solid #93445d;border-radius:5px}canvas{display:block;max-width:100%;height:auto;margin:auto}output{display:block;padding:8px}#errors{color:#ff859c}</style></head><body>
<header><b>OBLIVION · CALAMITY REVIEW</b><button onclick="scene('normal')">기본 UI</button><button onclick="scene('basic')">관통 평타</button><button onclick="scene('q')">Q 공간 파쇄</button><button onclick="scene('e')">E 재앙의 손</button><button onclick="scene('x')">X 괴물 해방</button><button onclick="scene('r')">R 종언의 현현</button><button onclick="scene('finale')">궁극기 마무리</button><button onclick="scene('lowlevel')">10레벨 잠금</button><button onclick="resizeReview(1280,720,false)">PC</button><button onclick="resizeReview(844,390,true)">모바일</button><button onclick="resizeReview(568,320,true)">작은 폰</button><button onclick="resizeReview(640,480,false)">좁은 PC</button><button onclick="step(12)">12프레임</button><button onclick="step(60)">60프레임</button><button onclick="animateReview()">애니메이션</button><button onclick="benchmark()">성능 300</button><button onclick="settingsReview()">조작 설정</button></header><canvas id="game"></canvas><output id="status">Loading</output><output id="errors"></output>
<script>
const nativeRAF=requestAnimationFrame.bind(window);window.requestAnimationFrame=()=>0;let ready=false,phone=false,kind='normal',animationToken=0;
addEventListener('error',e=>document.getElementById('errors').textContent+=e.message+'\n');addEventListener('unhandledrejection',e=>document.getElementById('errors').textContent+=String(e.reason)+'\n');
function report(extra=''){const s=oblivionState;document.getElementById('status').textContent=JSON.stringify({scene:kind,frame:s.frame,gauge:Math.round(s.gauge),form:s.empowered,ultimate:s.ultimateTime,skills:MOBILE_SKILL_KEYS.oblivion.length,casts:s.casts.length,effects:s.effects.length,mobile:phone})+' '+extra;}
function paint(){draw();report();}
function simulate(n){for(let i=0;i<n;i++){player.fireCooldown=Math.max(0,player.fireCooldown-1);updateOblivionPresentation();updateOblivionCombat();updateOblivionCombatHud();}updateCamera();}
function step(n){simulate(n);paint();}
function resizeReview(w,h,mobile){phone=mobile;canvas.width=w;canvas.height=!mobile&&w>=1000?Math.min(h,Math.max(390,innerHeight-150)):h;isMobileTouchDevice=()=>phone;updateCamera();if(ready)paint();}
function scene(v){if(!ready)return;animationToken++;kind=v;characterDetailId=null;selectedCharacter='oblivion';restart();screenMode='game';player.level=v==='lowlevel'?9:20;player.hp=73;player.exp=4;player.expNeed=12;player.x=1700;player.y=1150;player.damage=35;updateCamera();mouse.worldX=player.x+240;mouse.worldY=player.y-35;mouse.x=(mouse.worldX-camera.x)*getWorldViewScale();mouse.y=(mouse.worldY-camera.y)*getWorldViewScale();for(let i=0;i<24;i++){const a=i*2.39996,r=150+i%5*65;zombies.push({id:10000+i,x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r,r:18,hp:1000000,maxHp:1000000,speed:.9,expValue:1,scoreValue:10});}updateOblivionPresentation();if(v==='basic'){shoot();simulate(9);}if(v==='q'){activateOblivionQ();simulate(15);}if(v==='e'){activateOblivionE();simulate(28);}if(v==='x'){oblivionState.gauge=100;activateOblivionX();simulate(32);shoot();simulate(5);}if(v==='r'||v==='finale'){activateOblivionR();simulate(v==='r'?48:590);activateOblivionQ();activateOblivionE();shoot();simulate(v==='r'?22:22);}paint();}
async function animateReview(){const token=++animationToken;for(let i=0;i<420&&token===animationToken;i++){if(i%20===0)shoot();if(i%180===0)activateOblivionQ();if(i%360===0)activateOblivionE();simulate(1);draw();if(i%30===0)report();await new Promise(nativeRAF);}report();}
function settingsReview(){scene('normal');phone=true;isMobileTouchDevice=()=>phone;screenMode='mobileSettings';mobileSettingsPage='controls';paint();}
async function benchmark(){scene('r');for(let i=zombies.length;i<300;i++){const a=i*2.39996,r=80+i%9*48;zombies.push({id:20000+i,x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r,r:18,hp:1000000,maxHp:1000000,speed:.9,expValue:1,scoreValue:10});}const times=[];for(let i=0;i<240;i++){const start=performance.now();if(i%16===0)shoot();if(i%120===0){player.oblivionqCooldown=0;activateOblivionQ();}if(i%180===0){player.oblivioneCooldown=0;activateOblivionE();}simulate(1);draw();times.push(performance.now()-start);if(i%12===0)await new Promise(resolve=>setTimeout(resolve,0));}times.sort((a,b)=>a-b);report(`300 enemies combat+draw CPU median ${times[120].toFixed(2)}ms p95 ${times[228].toFixed(2)}ms`);}
(async()=>{const html=await(await fetch('index.html?calamity-review='+Date.now(),{cache:'no-store'})).text(),doc=new DOMParser().parseFromString(html,'text/html');for(const original of doc.querySelectorAll('script[src]')){const src=original.getAttribute('src');if(src.includes('pwa.js')||src.includes('studio-intro.js'))continue;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src+(src.includes('?')?'&':'?')+'review='+Date.now();s.onload=resolve;s.onerror=reject;document.head.append(s);});}saveTotalKills=()=>{};isMobileTouchDevice=()=>phone;selectedCharacter='oblivion';screenMode='game';prepareGameImages();await Promise.all(gameImageRegistry.filter(im=>im.assetRequested).map(im=>im.decode().catch(()=>{})));ready=true;resizeReview(1280,720,false);scene('normal');})();
</script></body></html>

<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Relic artwork QA</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#090f1b;color:#e5edf8;font:14px system-ui,sans-serif}header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:24px}h1{font-size:24px;margin:0}header p{margin:0;color:#9db1c6}select,button{border:1px solid #45647d;border-radius:6px;padding:8px 12px;background:#182a3d;color:#e5edf8;font:inherit}.set{display:grid;grid-template-columns:190px repeat(4,minmax(0,1fr));align-items:center;border-top:1px solid #31435c;padding:16px 0;gap:18px}.set h2{font-size:17px;line-height:1.6;margin:0}.set h2 small{display:block;font-size:11px;color:#75ccd8;letter-spacing:2px}.piece{margin:0;text-align:center;min-width:0}.disc{display:grid;place-items:center;width:116px;height:116px;max-width:100%;margin:auto;border-radius:50%;background:radial-gradient(circle at 35% 25%,#304664,#121d30 70%);box-shadow:inset 0 0 0 1px #a7bcd578,0 0 0 4px #101928}.disc img{width:94%;height:94%;object-fit:contain}.piece figcaption{font-size:12px;margin-top:8px}.piece small{display:block;color:#8196b2;font-size:10px;margin-top:3px}.tiny .disc{width:56px;height:56px}#status{color:#87cbd4}img.failed{outline:2px solid #f66378}body.light .disc{background:#d9e4f0}body.light{background:#c5d0de;color:#142335}@media(max-width:700px){body{padding:14px}.set{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.set h2{grid-column:1/-1}.piece figcaption{font-size:10px}.disc{width:90px;height:90px}}
</style></head>
<body><header><div><h1>RELIC ART · 세트별 원화 검수</h1><p>개발용 미리보기 · 게임 저장 데이터는 읽거나 변경하지 않습니다.</p></div><select id="group" aria-label="세트 그룹"><option value="all">전체 31세트</option value="A">일반 세트</option><option value="B">특수 세트</option><option value="C">캐릭터 특화</option><option value="D">저주 세트</option><option value="sample">대표 세트 비교</option></select><button id="small">작은 슬롯 크기</button><button id="light">밝은 배경</button><output id="status"></output></header><main id="gallery"></main>
<script>
// Parse catalog metadata as text; do not execute the game or grant test items.
const sample=['A01','C01','C15','C16','C17','C18','D01'],normal=['core','armor','lens','boots'],special=['emblem','power'];let sets=[];
function render(){const filter=document.getElementById('group').value;let count=0,loaded=0;const gallery=document.getElementById('gallery');gallery.replaceChildren();
  for(const set of sets.filter(s=>filter==='all'||(filter==='sample'?sample.includes(s.id):s.id.startsWith(filter)))){const row=document.createElement('section');row.className='set';const title=document.createElement('h2'),id=document.createElement('small');id.textContent=set.id;title.append(id,document.createTextNode(set.name));row.append(title);
    set.slots.forEach((slot,index)=>{count++;const figure=document.createElement('figure'),disc=document.createElement('div'),img=document.createElement('img'),caption=document.createElement('figcaption'),code=document.createElement('small');figure.className='piece';disc.className='disc';img.alt=set.names[index];img.src=`../assets/relics-v2/${set.id}-${slot}.webp`;img.decoding='async';img.onload=()=>{loaded++;document.getElementById('status').textContent=`${loaded} / ${count} 로드`;};img.onerror=()=>{img.className='failed';};caption.textContent=set.names[index];code.textContent=slot;caption.append(code);disc.append(img);figure.append(disc,caption);row.append(figure);});gallery.append(row);
  }document.getElementById('status').textContent=`${loaded} / ${count} 로드`;
}
document.getElementById('group').onchange=render;document.getElementById('small').onclick=()=>document.body.classList.toggle('tiny');document.getElementById('light').onclick=()=>document.body.classList.toggle('light');
fetch('../js/17-relic-data.js').then(r=>r.text()).then(source=>{sets=[...source.matchAll(/add\('([A-D]\d{2})','([^']+)','([^']+)'/g)].map(([,id,name,names])=>({id,name,names:names.split('|'),slots:id.startsWith('B')?special:normal}));render();});
</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><base href="../"><title>Movement controls QA</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="relics.css"><link rel="stylesheet" href="run-results.css"><style>
nav{position:fixed;bottom:0;left:0;z-index:9999;display:flex;gap:6px;background:#07101be8;padding:7px;font:12px system-ui;color:#dceef7}button{background:#183346;color:#e8f6ff;border:1px solid #6b8fa0;border-radius:5px;padding:6px}output{max-width:700px;white-space:pre-wrap}#qa-errors{color:#ff8095}
</style></head><body><canvas id="game"></canvas><nav><button onclick="openMobileSettings();draw()">조작 설정</button><button onclick="combat('zero')">제로 전투</button><button onclick="combat('ren')">렌 전투</button><button onclick="combat('lush')">LusH 전투</button><button onclick="combat('oblivion')">오블리비언</button><button onclick="combat('aria')">아리아</button><output id="qa-status">Loading</output><output id="qa-errors"></output></nav><script>
// Isolated preferences and save data; the real player's storage is never touched.
const qaStorage=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>qaStorage.get(k)??null,setItem:(k,v)=>qaStorage.set(k,String(v)),removeItem:k=>qaStorage.delete(k)},configurable:true});
window.requestAnimationFrame=()=>0;let ready=false;
addEventListener('error',e=>document.getElementById('qa-errors').textContent+=e.message+'\n');
addEventListener('unhandledrejection',e=>document.getElementById('qa-errors').textContent+=String(e.reason)+'\n');
async function combat(character){if(!ready)return;selectedCharacter=character;selectWorldStage(2,'easy');restart();screenMode='game';choosingUpgrade=false;paused=false;gameOver=false;raidVictory=false;player.level=10;player.hp=player.maxHp=10000;player.x=1800;player.y=1200;zombies=[];updateCamera();prepareGameImages();await Promise.all(gameImageRegistry.filter(i=>i.assetRequested).map(i=>i.decode().catch(()=>{})));draw();}
setInterval(()=>{if(!ready)return;if(screenMode==='game'&&!paused&&!gameOver&&!choosingUpgrade){updatePlayer();updateCamera();screenToWorld();updateParticles();}draw();document.getElementById('qa-status').textContent=JSON.stringify({mode:desktopControlMode,screen:screenMode,page:mobileSettingsPage,character:selectedCharacter,x:player.x,y:player.y,target:desktopMoveTarget,keys:['q','e','x','r'].map(k=>getSkillHotkey(k)),zeroE:player.zeroECooldown,zeroX:player.zeroXCooldown});},1000/60);
(async()=>{const markup=await(await fetch('index.html?qa='+Date.now(),{cache:'no-store'})).text();const doc=new DOMParser().parseFromString(markup,'text/html');for(const old of doc.querySelectorAll('script[src]')){const src=old.getAttribute('src');if(src.includes('pwa.js')||src.includes('studio-intro.js'))continue;await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=src+(src.includes('?')?'&':'?')+'qa='+Date.now();script.onload=resolve;script.onerror=()=>reject(new Error(src));document.head.append(script);});}saveTotalKills=()=>{};ready=true;openMobileSettings();draw();})();
</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Astra 3D review</title>
<style>html,body{margin:0;background:#101827;color:#dde8fb;font:14px Arial}main{width:100%;height:90vh;background:radial-gradient(ellipse at 50% 40%,#223352,#101827 60%)}nav{display:flex;gap:10px;padding:10px}button{background:#263756;color:#fff;border:1px solid #8f9fac;padding:8px}#report{white-space:pre-wrap}</style></head>
<body><nav><button id="front">Front</button><button id="left">Left</button><button id="back">Back</button><button id="stop">Stop / Play</button><output id="report">Loading…</output></nav><main id="model"></main>
<script type="module">
import{createAstraModel}from'../js/astra-model.mjs';
const host=document.getElementById('model'),viewer=createAstraModel(host);let playing=true;
document.getElementById('stop').onclick=()=>{playing=!playing;if(playing)frame();};
document.getElementById('front').onclick=()=>viewer.reset();
document.getElementById('left').onclick=()=>viewer.turnTo(Math.PI/2);
document.getElementById('back').onclick=()=>viewer.turnTo(Math.PI);
function frame(){if(!playing)return;viewer.render(host.clientWidth,host.clientHeight,performance.now()/1000);document.getElementById('report').textContent=JSON.stringify(viewer.stats());requestAnimationFrame(frame);}frame();
</script></body></html>

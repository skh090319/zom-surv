<!doctype html><html lang="ko"><head><meta charset="utf-8"><base href="../"><title>Relic archive review</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="relics.css"><style>html,body{height:auto;overflow:auto}body{margin:0;background:#080d16;color:#daeaf5;font:13px system-ui}header{display:flex;flex-wrap:wrap;gap:6px;padding:8px}button{padding:7px 10px;background:#152637;color:#e0f5ff;border:1px solid #456782;border-radius:5px}canvas{display:block;max-width:100%;height:auto;margin:auto}output{display:block;padding:8px}#errors{color:#ff859c}</style></head><body>
<header><b>RELIC / QA</b><button onclick="scene('home')">로비</button><button onclick="scene('equipment')">장비</button><button onclick="scene('augment')">증강</button><button onclick="scene('monsters')">몬스터</button><button onclick="scene('relics')">유물 도감</button><button onclick="scene('boss')">보호막</button><button onclick="breakShield()">파괴</button><button onclick="size(false)">PC</button><button onclick="size(true)">모바일</button><button onclick="guideScrollY=guideScrollMax;paint()">도감 맨 아래</button></header>
<canvas id="game"></canvas><output id="status">Loading</output><output id="errors"></output>
<script>
window.requestAnimationFrame=()=>0;let ready=false,phone=false;
addEventListener('error',e=>document.getElementById('errors').textContent+=e.message+'\n');addEventListener('unhandledrejection',e=>document.getElementById('errors').textContent+=String(e.reason)+'\n');
function paint(){draw();document.getElementById('status').textContent=JSON.stringify({screen:screenMode,phone,inventory:relicStore.inventory.length,shield:activeRaidBoss?.relicShield,scroll:guideScrollY,max:guideScrollMax,errors:document.getElementById('errors').textContent});}
function size(mobile){phone=mobile;canvas.width=mobile?Math.min(844,innerWidth):1280;canvas.height=mobile?390:720;isMobileTouchDevice=()=>mobile;updateCamera();if(ready)paint();}
function scene(which){if(!ready)return;const root=document.getElementById('relic-screen');if(root)root.hidden=true;screenMode='home';mouse.down=false;paused=false;choosingUpgrade=false;gameOver=false;raidVictory=false;
  if(which==='home')paint();else if(which==='equipment'){openRelicInventory();paint();}else if(which==='boss'){restart();screenMode='game';choosingUpgrade=false;startRaidBoss(0);raidIntroTime=0;relicTrackEnemy(activeRaidBoss);updateCamera();paint();}else{openGuideScreen(which);paint();}
}
function breakShield(){if(activeRaidBoss){relicTagTarget(activeRaidBoss,null,{kind:'basic',canCrit:false});activeRaidBoss.hp-=activeRaidBoss.relicShield+1;paint();}}
setInterval(()=>{if(ready)paint();},350);
(async()=>{const html=await(await fetch('index.html?review='+Date.now(),{cache:'no-store'})).text(),doc=new DOMParser().parseFromString(html,'text/html');for(const original of doc.querySelectorAll('script[src]')){const src=original.getAttribute('src');if(src.includes('pwa.js')||src.includes('studio-intro.js'))continue;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src+(src.includes('?')?'&':'?')+'review='+Date.now();s.onload=resolve;s.onerror=reject;document.head.append(s);});}saveTotalKills=()=>{};selectedCharacter='astra';screenMode='home';prepareGameImages();await Promise.all(gameImageRegistry.filter(img=>img.assetRequested).map(img=>img.decode().catch(()=>{})));ready=true;size(false);scene('home');})();
</script></body></html>

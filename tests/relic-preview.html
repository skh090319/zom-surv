<!doctype html><html lang="ko"><head><meta charset="utf-8"><base href="../"><title>Relic archive review</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="relics.css?v=20261019-roots-results1"><style>html,body{height:auto;overflow:auto}body{margin:0;background:#080d16;color:#daeaf5;font:13px system-ui}header{display:flex;flex-wrap:wrap;gap:6px;padding:8px}button{padding:7px 10px;background:#152637;color:#e0f5ff;border:1px solid #456782;border-radius:5px}canvas{display:block;max-width:100%;height:auto;margin:auto}output{display:block;padding:8px}#errors{color:#ff859c}</style></head><body>
<header><b>RELIC / QA</b><button onclick="scene('home')">로비</button><button onclick="scene('equipment')">장비</button><button onclick="scene('augment')">증강</button><button onclick="scene('monsters')">몬스터</button><button onclick="scene('relics')">유물 도감</button><button onclick="scene('boss')">보호막</button><button onclick="breakShield()">파괴</button><button onclick="size(false)">PC</button><button onclick="size(true)">모바일</button><button onclick="guideScrollY=guideScrollMax;paint()">도감 맨 아래</button><button onclick="seedRelicFeed()">강화·장착 QA</button><button onclick="previewYupiter()">유피테르 QA</button><button onclick="activateYupiterSkill();paint()">유피테르 E</button></header>
<header><b>출격 능력치 QA</b><button onclick="previewLoadoutStats('astra',false)">미장착</button><button onclick="previewLoadoutStats('astra',true)">유물 장착</button><button onclick="previewLoadoutStats('yupiter',false)">유피테르 능력치</button><button onclick="previewLoadoutStats('suncall',false)">썬콜 능력치</button></header>
<canvas id="game"></canvas><output id="status">Loading</output><output id="errors"></output>
<script>
// QA actions must never read or overwrite a player's saved inventory on this origin.
const previewStorage=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:key=>previewStorage.get(key)??null,setItem:(key,value)=>previewStorage.set(key,String(value)),removeItem:key=>previewStorage.delete(key),clear:()=>previewStorage.clear()},configurable:true});
window.requestAnimationFrame=()=>0;let ready=false,phone=false;
addEventListener('error',e=>document.getElementById('errors').textContent+=e.message+'\n');addEventListener('unhandledrejection',e=>document.getElementById('errors').textContent+=String(e.reason)+'\n');
function paint(){draw();document.getElementById('status').textContent=JSON.stringify({screen:screenMode,phone,inventory:relicStore.inventory.length,shield:activeRaidBoss?.relicShield,scroll:guideScrollY,max:guideScrollMax,errors:document.getElementById('errors').textContent});}
function size(mobile){phone=mobile;canvas.width=mobile?Math.min(844,innerWidth):1280;canvas.height=mobile?390:720;isMobileTouchDevice=()=>mobile;updateCamera();if(ready)paint();}
function scene(which){if(!ready)return;const root=document.getElementById('relic-screen');if(root)root.hidden=true;screenMode='home';mouse.down=false;paused=false;choosingUpgrade=false;gameOver=false;raidVictory=false;
  if(which==='home')paint();else if(which==='equipment'){openRelicInventory();paint();}else if(which==='boss'){restart();screenMode='game';choosingUpgrade=false;startRaidBoss(0);raidIntroTime=0;relicTrackEnemy(activeRaidBoss);updateCamera();paint();}else{openGuideScreen(which);paint();}
}
function breakShield(){if(activeRaidBoss){relicTagTarget(activeRaidBoss,null,{kind:'basic',canCrit:false});activeRaidBoss.hp-=activeRaidBoss.relicShield+1;paint();}}
function seedRelicFeed(){if(!ready)return;selectedCharacter='astra';screenMode='home';paused=false;relicStore=relicStarterStore();const target=relicCreate({setId:'A02',slot:'core',rarity:'epic'}),other=relicCreate({setId:'C01',slot:'armor',rarity:'legendary'});relicStore.inventory.push(target,other,...['common','rare','superRare','epic','legendary'].map((rarity,i)=>relicCreate({setId:['A03','A04','A05','C17','C18'][i],slot:'lens',rarity})));relicStore.loadouts.mare={armor:other.id};relicView.selected=target.id;relicView.slot='';relicView.query='';relicView.rarity='';openRelicInventory();document.getElementById('relic-workspace').scrollIntoView();}
function previewYupiter(){if(!ready)return;const root=document.getElementById('relic-screen');if(root)root.hidden=true;selectedCharacter='yupiter';restart();screenMode='game';choosingUpgrade=false;player.level=10;updateCamera();paint();}
function previewLoadoutStats(hero='astra',equipped=false){
  if(!ready)return;selectedCharacter=hero;screenMode='home';relicStore=relicStarterStore();relicStore.loadouts={};
  if(equipped){
    const items=Object.keys(RELIC_SLOTS).map(slot=>{const item=relicCreate({setId:['emblem','power'].includes(slot)?'B03':'A04',slot,rarity:'legendary',mainStat:slot==='lens'?'critChance':slot==='boots'?'moveSpeed':slot==='power'?'cooldown':undefined});item.substats=[{stat:'critDamage',count:0},{stat:'atkPct',count:0}];return relicEnhancePreview(item,100000).item;});
    relicStore.inventory.push(...items);relicStore.loadouts[hero]=Object.fromEntries(items.map(item=>[item.slot,item.id]));
  }
  relicView.slot='';relicView.query='';relicView.rarity='';relicView.selected=null;openRelicInventory();document.getElementById('relic-loadout-stats').scrollIntoView({block:'center'});paint();
}
setInterval(()=>{if(ready)paint();},350);
(async()=>{const html=await(await fetch('index.html?review='+Date.now(),{cache:'no-store'})).text(),doc=new DOMParser().parseFromString(html,'text/html');for(const original of doc.querySelectorAll('script[src]')){const src=original.getAttribute('src');if(src.includes('pwa.js')||src.includes('studio-intro.js'))continue;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src+(src.includes('?')?'&':'?')+'review='+Date.now();s.onload=resolve;s.onerror=reject;document.head.append(s);});}saveTotalKills=()=>{};selectedCharacter='astra';screenMode='home';prepareGameImages();await Promise.all(gameImageRegistry.filter(img=>img.assetRequested).map(img=>img.decode().catch(()=>{})));ready=true;size(false);scene('home');})();
</script></body></html>

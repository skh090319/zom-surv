<!doctype html><html lang="ko"><head><meta charset="utf-8"><base href="../"><title>Aria royal visual QA</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="relics.css"><style>html,body{height:auto;overflow:auto}body{margin:0;background:#081411;color:#eaf2df;font:13px system-ui}header{display:flex;gap:6px;padding:8px;flex-wrap:wrap}button{padding:7px 12px;background:#15382f;border:1px solid #baa285;color:#fff0df;border-radius:5px}canvas{display:block;max-width:100%;height:auto;margin:auto}output{display:block;padding:7px}#errors{color:#ff8196}</style></head><body>
<header><b>ARIA / ROYAL QA</b><button onclick="home()">로비</button><button onclick="combat()">아리아 전투</button><button onclick="cast('q')">Q 가시</button><button onclick="cast('e')">E 심판</button><button onclick="cast('x')">X 폭풍</button><button onclick="cast('r')">R 세계수</button><button onclick="running=!running">재생·정지</button><button onclick="size(false)">PC</button><button onclick="size(true)">모바일</button><button onclick="yupiter()">유피테르</button><button onclick="activateYupiterSkill();paint()">무기 10회 사용</button><button onclick="selectedCharacter='aria';openGuideScreen('augment');guideAugmentTab='exclusive';guideExclusiveCharacter='aria';paint()">증강</button></header>
<canvas id="game"></canvas><output id="status">Loading</output><output id="errors"></output>
<script>
const previewStorage=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>previewStorage.get(k)??null,setItem:(k,v)=>previewStorage.set(k,String(v)),removeItem:k=>previewStorage.delete(k)},configurable:true});
window.requestAnimationFrame=()=>0;let ready=false,phone=false,running=false,ticks=0;
addEventListener('error',e=>document.getElementById('errors').textContent+=e.message+'\n');addEventListener('unhandledrejection',e=>document.getElementById('errors').textContent+=String(e.reason)+'\n');
function paint(){draw();document.getElementById('status').textContent=JSON.stringify({screen:screenMode,character:selectedCharacter,phone,frame:ticks,tree:ariaWorldTree?.life??0,fields:ariaJudgments.length,storm:ariaPetalStorm?.life??0,assets:gameImageRegistry.filter(i=>i.assetGroup==='aria'&&i.assetRequested).map(i=>[i.assetSource,i.naturalWidth]),errors:document.getElementById('errors').textContent});}
function size(m){phone=m;canvas.width=m?844:1280;canvas.height=m?390:720;isMobileTouchDevice=()=>m;isMobilePortraitMode=()=>false;updateCamera();if(ready)paint();}
function home(){running=false;selectedCharacter='aria';screenMode='home';paint();}
function combat(){running=false;selectedCharacter='aria';restart();screenMode='game';choosingUpgrade=false;paused=false;gameOver=false;raidVictory=false;player.level=10;player.damage=100;player.exp=37;player.expNeed=100;player.hp=800;player.maxHp=1000;player.x=WORLD.width/2;player.y=WORLD.height/2;mouse.worldX=player.x+120;mouse.worldY=player.y+60;zombies=[];for(let i=0;i<16;i++){const a=i*2.399,r=180+(i%4)*65;zombies.push({id:'qa'+i,x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r,r:21,speed:0,hp:1e8,maxHp:1e8,boss:false});}for(let i=0;i<5;i++){const a=i*Math.PI*2/5;const s=createAriaSoil(player.x+Math.cos(a)*160,player.y+Math.sin(a)*160);s.stage=3;}ticks=0;updateCamera();paint();}
function cast(key){player['aria'+key.toUpperCase()+'Cooldown']=0;({q:activateAriaQ,e:activateAriaE,x:activateAriaX,r:activateAriaR})[key]();for(let i=0;i<(key==='r'?75:key==='q'?9:20);i++){updateAria();ticks++;}paint();}
function yupiter(){running=false;selectedCharacter='yupiter';restart();screenMode='game';choosingUpgrade=false;player.level=10;updateCamera();paint();}
setInterval(()=>{if(!ready)return;if(running&&screenMode==='game'&&selectedCharacter==='aria'){updateAria();ticks++;}paint();},1000/60);
(async()=>{const text=await(await fetch('index.html?qa='+Date.now(),{cache:'no-store'})).text(),doc=new DOMParser().parseFromString(text,'text/html');for(const old of doc.querySelectorAll('script[src]')){const src=old.getAttribute('src');if(src.includes('pwa.js')||src.includes('studio-intro.js'))continue;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src+(src.includes('?')?'&':'?')+'qa='+Date.now();s.onload=resolve;s.onerror=reject;document.head.append(s);});}saveTotalKills=()=>{};ready=true;size(false);combat();})();
</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><base href="../"><title>Aria growth visual QA</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="relics.css"><style>html,body{height:auto;overflow:auto}body{margin:0;background:#081411;color:#eaf2df;font:13px system-ui}header{display:flex;gap:6px;padding:8px;flex-wrap:wrap}button{padding:7px 12px;background:#15382f;border:1px solid #baa285;color:#fff0df;border-radius:5px}canvas{display:block;max-width:100%;height:auto;margin:auto}output{display:block;padding:7px;overflow-wrap:anywhere}#errors{color:#ff8196}</style></head><body>
<header><b>ARIA / WORLD TREE QA</b><button onclick="home()">로비</button><button onclick="combat()">아리아 전투</button><button onclick="cast('attack')">평타</button><button onclick="cast('q')">Q 칙령</button><button onclick="cast('e')">E 기생화</button><button onclick="cast('x')">X 수확</button><button onclick="cast('r')">R 에덴</button><button onclick="running=!running">재생·정지</button><button onclick="size(false)">PC</button><button onclick="size(true)">모바일</button><button onclick="selectedCharacter='aria';openGuideScreen('augment');guideAugmentTab='exclusive';guideExclusiveCharacter='aria';paint()">증강</button></header>
<header><b>GROWTH QA</b><button onclick="growth(0)">정수 0</button><button onclick="growth(50)">정수 50</button><button onclick="growth(100)">정수 100</button><button onclick="growth(200)">정수 200</button><button onclick="growth(300)">정수 300</button><button onclick="growth(450)">정수 450</button><button onclick="growth(600)">정수 600</button><button onclick="growth(900)">정수 900</button><button onclick="growth(1200)">정수 1200</button><button onclick="moveAway()">멀리 이동</button><button onclick="ultimateFrame(30)">시전 0.5초</button><button onclick="ultimateFrame(690)">배경 복귀 중</button><button onclick="ultimateFrame(721)">궁극기 종료</button></header>
<header><b>HIT / CONSUME QA</b><button onclick="qFrame(0)">Q 시작</button><button onclick="qFrame(9)">Q 관통</button><button onclick="qFrame(22)">Q 잔광</button><button onclick="devourFrame(0)">섭취 시작</button><button onclick="devourFrame(27)">섭취 중간</button><button onclick="devourFrame(45)">뿌리에 흡수</button><button onclick="devourFrame(54)">섭취 완료</button><button onclick="running=false;advance(1);paint()">1프레임 진행</button><button onclick="running=false;advance(15);paint()">15프레임 진행</button></header>
<style>canvas{width:auto;max-height:calc(100vh - 210px);object-fit:contain}</style>
<canvas id="game"></canvas><output id="status">Loading</output><output id="errors"></output>
<script>
const previewStorage=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>previewStorage.get(k)??null,setItem:(k,v)=>previewStorage.set(k,String(v)),removeItem:k=>previewStorage.delete(k)},configurable:true});
window.requestAnimationFrame=()=>0;let ready=false,phone=false,running=false,ticks=0;
addEventListener('error',e=>document.getElementById('errors').textContent+=e.message+'\n');addEventListener('unhandledrejection',e=>document.getElementById('errors').textContent+=String(e.reason)+'\n');
function paint(){draw();document.getElementById('status').textContent=JSON.stringify({screen:screenMode,character:selectedCharacter,phone,frame:ticks,growth:typeof getAriaGrowthProgress==='function'?getAriaGrowthProgress():null,tree:getAriaTreePosition(),treeRange:getAriaTreeAttackRange(),ultimate:ariaWorldTree?.life??0,projectiles:ariaBolts.length,infections:zombies.filter(z=>z.ariaInfection).length,enemies:zombies.length,hp:player.hp,devoured:ariaDevouredEnemies.map(z=>({x:z.x,y:z.y,tx:z.tx,ty:z.ty,life:z.life,age:z.age})),qHits:ariaEffects.filter(e=>e.type==='thornImpact').length,assets:gameImageRegistry.filter(i=>i.assetGroup==='aria'&&i.assetRequested).map(i=>[i.assetSource,i.naturalWidth]),errors:document.getElementById('errors').textContent});}
function size(m){phone=m;canvas.width=m?844:1280;canvas.height=m?390:720;isMobileTouchDevice=()=>m;isMobilePortraitMode=()=>false;updateCamera();if(ready)paint();}
function advance(n){for(let i=0;i<n;i++){if(player.fireCooldown>0)player.fireCooldown--;updateAria();ticks++;}}
function home(){running=false;selectedCharacter='aria';screenMode='home';paint();}
function combat(){running=false;selectedCharacter='aria';restart();screenMode='game';choosingUpgrade=false;paused=false;gameOver=false;raidVictory=false;player.level=10;player.damage=100;player.exp=37;player.expNeed=100;player.maxHp=1000;player.hp=800;player.x=WORLD.width/2;player.y=WORLD.height/2;mouse.worldX=player.x+220;mouse.worldY=player.y+60;zombies=[];for(let i=0;i<16;i++){const a=i*2.399,r=180+(i%4)*65;zombies.push({id:'qa'+i,x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r,r:21,speed:0,hp:1e8,maxHp:1e8,boss:false});}ticks=0;updateCamera();paint();}
function cast(key){player.fireCooldown=0;player['aria'+key.toUpperCase()+'Cooldown']=0;({attack:attackWithAria,q:activateAriaQ,e:activateAriaE,x:activateAriaX,r:activateAriaR})[key]();advance(key==='r'?75:key==='q'?9:key==='attack'?5:20);paint();}
function growth(value){running=false;ariaGrowth.essence=value;ariaGrowth.stage=getAriaGrowthStage();advance(180);paint();}
function moveAway(){player.x+=550;player.y+=200;mouse.worldX=player.x+220;mouse.worldY=player.y+60;updateCamera();paint();}
function ultimateFrame(frame){player.ariaRCooldown=0;activateAriaR();advance(frame);paint();}
function qFrame(frame){combat();zombies=[];const tree=getAriaTreePosition();player.x=tree.x-270;player.y=tree.y+165;mouse.worldX=player.x+780;mouse.worldY=player.y;for(let i=0;i<6;i++)zombies.push({id:'q-hit-'+i,x:player.x+105+i*110,y:player.y,r:21,speed:0,hp:1e8,maxHp:1e8,boss:false});ariaGrowth.treeTick=10000;updateCamera();activateAriaQ();advance(frame);paint();}
function devourFrame(frame){combat();zombies=[];const tree=getAriaTreePosition();ariaGrowth.essence=600;ariaGrowth.stage=getAriaGrowthStage();ariaGrowth.visualStage=ariaGrowth.stage;player.x=tree.x+180;player.y=tree.y+150;mouse.worldX=player.x+220;mouse.worldY=player.y;for(let i=0;i<4;i++){const angle=-.3+i*1.5,distance=250+i*90;zombies.push({id:'consume-'+i,x:tree.x+Math.cos(angle)*distance,y:tree.y+Math.sin(angle)*distance,r:i===1?28:21,speed:3,hp:1,maxHp:1000,boss:i===1,isBossMinion:i===2,raidSprite:1});}ariaGrowth.treeTick=10000;updateCamera();ariaTreeAttack();updateZombies();advance(frame);paint();}
setInterval(()=>{if(!ready)return;if(running&&screenMode==='game'&&selectedCharacter==='aria')advance(1);paint();},1000/60);
(async()=>{const text=await(await fetch('index.html?qa='+Date.now(),{cache:'no-store'})).text(),doc=new DOMParser().parseFromString(text,'text/html');for(const old of doc.querySelectorAll('script[src]')){const src=old.getAttribute('src');if(src.includes('pwa.js')||src.includes('studio-intro.js'))continue;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src+(src.includes('?')?'&':'?')+'qa='+Date.now();s.onload=resolve;s.onerror=reject;document.head.append(s);});}saveTotalKills=()=>{};ready=true;size(false);combat();})();
</script></body></html>

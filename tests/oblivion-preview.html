<!doctype html><html lang="ko"><head><meta charset="utf-8"><base href="../"><title>Oblivion review</title><link rel="stylesheet" href="style.css"><style>html,body{height:auto;overflow:auto}body{margin:0;background:#100a13;color:#ffdae5;font:14px system-ui}header{display:flex;flex-wrap:wrap;gap:8px;padding:10px}button{padding:8px 12px;background:#210e1a;color:#ffe7ef;border:1px solid #b66580;border-radius:5px}canvas{display:block;max-width:100%;height:auto;margin:auto}output{display:block;padding:8px}#errors{color:#ff859c}</style></head><body>
<header><b>OBLIVION · ART & UI</b><button onclick="scene('ui')">전용 UI</button><button onclick="scene('home')">로비</button><button onclick="scene('ui');screenMode='character';characterScrollY=1850;paint()">캐릭터 선택</button><button onclick="scene('ui');characterDetailId='oblivion';characterDetailSkillIndex=0;screenMode='character';paint()">상세 원화</button><button onclick="scene('background')">보존 배경·초상화</button><button onclick="scene('mare')">마레 원화</button><button onclick="resizeReview(false)">Desktop</button><button onclick="resizeReview(true)">Phone</button><button onclick="testRemoved()">스킬 삭제 확인</button><button onclick="animateBars()">HP·경험치 변화</button><button onclick="benchmark()">Profile 500</button><button onclick="scene('ui');screenMode='guide';guidePage='augment';guideAugmentTab='exclusive';guideExclusiveCharacter='oblivion';guideScrollY=0;paint()">증강 삭제 확인</button></header><canvas id="game"></canvas><output id="status">Loading</output><output id="errors"></output>
<script>
const nativeRAF=requestAnimationFrame.bind(window);window.requestAnimationFrame=()=>0;let ready=false,phone=false,kind='ui';
addEventListener('error',e=>document.getElementById('errors').textContent+=e.message+'\n');addEventListener('unhandledrejection',e=>document.getElementById('errors').textContent+=String(e.reason)+'\n');
function report(extra=''){document.getElementById('status').textContent=JSON.stringify({scene:kind,skills:MOBILE_SKILL_KEYS.oblivion.length,augments:upgrades.filter(u=>exclusiveAugmentOwners[u.id]==='oblivion').length,enemies:zombies.length,mobile:phone,background:oblivionBackdropTime>0})+' '+extra;}
function paint(){draw();report();}
function step(n){for(let i=0;i<n;i++)updateOblivionPresentation();updateCamera();paint();}
function resizeReview(v){phone=v;canvas.width=v?844:1280;canvas.height=v?390:760;isMobileTouchDevice=()=>v;updateCamera();if(ready)paint();}
function scene(v){if(!ready)return;kind=v;characterDetailId=null;selectedCharacter=v==='mare'?'mare':'oblivion';restart();screenMode=v==='home'||v==='mare'?'home':'game';player.level=10;player.damage=35;player.hp=73;player.exp=4;player.expNeed=12;player.x=1700;player.y=1150;updateCamera();mouse.worldX=player.x+180;mouse.worldY=player.y-55;mouse.x=(mouse.worldX-camera.x)*getWorldViewScale();mouse.y=(mouse.worldY-camera.y)*getWorldViewScale();if(screenMode==='game')for(let i=0;i<24;i++){const a=i*2.39996,r=150+i%5*65;zombies.push({id:i,x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r,r:18,hp:100000,maxHp:100000,speed:.9,expValue:1,scoreValue:10});}updateOblivionPresentation();if(v==='background')oblivionBackdropTime=255;paint();}
function testRemoved(){scene('ui');const before=JSON.stringify([player,zombies,bullets]);for(const key of ['q','e','x','r']){dispatchEvent(new KeyboardEvent('keydown',{key}));dispatchEvent(new KeyboardEvent('keyup',{key}));}for(let i=0;i<120;i++){shoot();updateOblivionPresentation();}const same=before===JSON.stringify([player,zombies,bullets]);paint();report(`PC Q/E/X/R and basic attack unchanged state: ${same?'PASS':'FAIL'}`);}
async function animateBars(){scene('ui');player.hp=34;player.exp=10;for(let i=0;i<100;i++){updateOblivionPresentation();draw();await new Promise(nativeRAF);}report('HP 73 → 34 · XP 4 → 10 · damage trail and animated fill');}
async function benchmark(){scene('ui');for(let i=zombies.length;i<500;i++){const a=i*2.39996,r=100+i%8*35;zombies.push({id:i,x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r,r:18,hp:100000,maxHp:100000,speed:.9});}const times=[];for(let i=0;i<180;i++){const t=performance.now();updateOblivionPresentation();draw();times.push(performance.now()-t);if(i%10===0)await new Promise(nativeRAF);}times.sort((a,b)=>a-b);report(`500 enemies presentation+draw CPU median ${times[90].toFixed(2)} ms p95 ${times[171].toFixed(2)} ms`);}
(async()=>{const html=await(await fetch('index.html?oblivion-review='+Date.now(),{cache:'no-store'})).text(),doc=new DOMParser().parseFromString(html,'text/html');for(const original of doc.querySelectorAll('script[src]')){const src=original.getAttribute('src');if(src.includes('pwa.js'))continue;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src+(src.includes('?')?'&':'?')+'review='+Date.now();s.onload=resolve;s.onerror=reject;document.head.append(s);});}saveTotalKills=()=>{};isMobileTouchDevice=()=>phone;selectedCharacter='oblivion';screenMode='game';prepareGameImages();ensureGameImage(astraSprite);for(const im of gameImageRegistry)if(im.assetGroup==='mare')ensureGameImage(im);await Promise.all(gameImageRegistry.filter(img=>img.assetRequested).map(img=>img.decode().catch(()=>{})));ready=true;resizeReview(false);scene('ui');})();
</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><base href="../"><title>Mare · moonlit ocean review</title><link rel="stylesheet" href="style.css"><style>html,body{height:auto;overflow:auto}body{margin:0;background:#071824;color:#d9ffff;font:14px system-ui}header{display:flex;flex-wrap:wrap;gap:8px;padding:10px}button{padding:8px 12px;background:#12394b;border:1px solid #71c6cf;border-radius:6px;color:#dfffff}canvas{display:block;max-width:100%;height:auto;margin:auto}output{display:block;padding:8px}#errors{color:#ff9292}</style></head><body>
<header><strong>MARE · MOONLIT OCEAN REVIEW</strong><button onclick="scene('q')">Q · 밀물</button><button onclick="scene('e')">E · 소용돌이</button><button onclick="scene('x')">X · 수압</button><button onclick="scene('r')">R · 레비아탄</button><button onclick="scene('home')">로비</button><button onclick="step(20)">+20 frames</button><button onclick="step(120)">+120 frames</button><button onclick="resizeReview(false)">Desktop</button><button onclick="resizeReview(true)">Phone</button><button onclick="benchmark()">Profile</button><button onclick="document.querySelector('header').style.display='none';scrollTo(0,0);paint()">Game view</button></header><canvas id="game" width="1280" height="760"></canvas><output id="status">Loading…</output><output id="errors"></output>
<script>
const nativeRAF=requestAnimationFrame.bind(window);window.requestAnimationFrame=()=>0;let ready=false,phone=false,kind='e';addEventListener('error',e=>document.getElementById('errors').textContent+=e.message+'\n');addEventListener('unhandledrejection',e=>document.getElementById('errors').textContent+=String(e.reason)+'\n');
function report(extra=''){document.getElementById('status').textContent=JSON.stringify({scene:kind,frame:marePresentationFrame,effects:mareEffects.length,currents:mareCurrents.length,mobile:phone,ultimate:player.mareUltimateTime})+' '+extra;}
function paint(){draw();report();}function step(n){for(let i=0;i<n;i++)updateMare();updateCamera();paint();}function resizeReview(v){phone=v;canvas.width=v?844:1280;canvas.height=v?390:760;isMobileTouchDevice=()=>v;updateCamera();if(ready)paint();}
function scene(v){if(!ready)return;kind=v;selectedCharacter='mare';restart();screenMode=v==='home'?'home':'game';player.level=10;player.damage=35;player.exp=4;player.expNeed=12;player.hp=73;player.x=1700;player.y=1150;updateCamera();mouse.worldX=player.x+200;mouse.worldY=player.y-55;mouse.x=(mouse.worldX-camera.x)*getWorldViewScale();mouse.y=(mouse.worldY-camera.y)*getWorldViewScale();for(let i=0;i<24;i++){const a=i*2.39996,r=150+i%5*65;zombies.push({id:i,x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r,r:18,hp:100000,maxHp:100000,speed:.9,expValue:1,scoreValue:10,mareWet:2,mareWetTime:360});}if(v==='home'){paint();return;}attackWithMare();if(v==='q'){activateMareQ();step(23);}else if(v==='e'){activateMareE();step(40);}else if(v==='x'){activateMareX();step(10);}else{activateMareR();step(45);} }
async function benchmark(){scene('r');activateMareE();for(let i=0;i<200;i++){const a=i*2.39996,r=100+i%8*35;zombies.push({id:i+100,x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r,r:18,hp:100000,maxHp:100000,speed:.9,expValue:1,scoreValue:10});}const times=[];for(let i=0;i<180;i++){const t=performance.now();updateMare();draw();times.push(performance.now()-t);if(i%10===0)await new Promise(nativeRAF);}times.sort((a,b)=>a-b);report(`224 enemies CPU median ${times[90].toFixed(2)} ms p95 ${times[171].toFixed(2)} ms`);}
(async()=>{const html=await(await fetch('index.html?mare-review='+Date.now(),{cache:'no-store'})).text(),doc=new DOMParser().parseFromString(html,'text/html');for(const original of doc.querySelectorAll('script[src]')){const src=original.getAttribute('src');if(src.includes('pwa.js'))continue;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src+(src.includes('?')?'&':'?')+'review='+Date.now();s.onload=resolve;s.onerror=reject;document.head.append(s);});}saveTotalKills=()=>{};isMobileTouchDevice=()=>phone;selectedCharacter='mare';screenMode='game';prepareGameImages();await Promise.all(gameImageRegistry.filter(img=>img.assetRequested).map(img=>img.decode().catch(()=>{})));ready=true;resizeReview(false);scene('e');})();
</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>World monsters QA</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="relics.css"><link rel="stylesheet" href="run-results.css"><style>
html,body{height:auto;overflow:auto}body{margin:0;background:#080d16;color:#dce8ef;font:12px system-ui}header{display:flex;flex-wrap:wrap;gap:6px;padding:8px}button{padding:7px 10px;background:#18293b;color:#e1f6ff;border:1px solid #4f6f86;border-radius:5px}canvas{display:block;width:auto;max-width:100%;height:auto;max-height:calc(100vh - 130px);object-fit:contain;margin:auto}output{display:block;padding:7px;overflow-wrap:anywhere}#errors{color:#ff8095}#gallery{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:20px}#gallery[hidden]{display:none}figure{margin:0;padding:10px;background:linear-gradient(#162436,#0b101b);border:1px solid #3b4b60;border-radius:12px;text-align:center}figure img{width:100%;height:230px;object-fit:contain}figcaption{font-size:15px;color:#e4edf5;padding:10px}figcaption small{display:block;font-size:11px;color:#9bb3c8;margin-top:5px}@media(max-width:700px){#gallery{grid-template-columns:repeat(2,minmax(0,1fr))}figure img{height:180px}}
canvas[hidden]{display:none}
</style></head><body>
<header><b>WORLD MONSTERS / QA</b><button onclick="combat(1)">1세계 전투</button><button onclick="combat(2)">2세계 기존 전투</button><button onclick="combat(3)">3세계 전투</button><button onclick="gallery()">원화 10종</button><button onclick="guide()">몬스터 도감</button><button onclick="guideScrollY=Math.min(guideScrollMax,guideScrollY+450);paint()">도감 아래로</button><button onclick="guideScrollY=0;paint()">도감 처음</button></header>
<header><button onclick="running=!running;paint()">재생·정지</button><button onclick="running=false;advance(45);paint()">45프레임 진행</button><button onclick="running=false;advance(180);paint()">3초 진행</button><button onclick="killType('split-larva')">유생 처치</button><button onclick="killType('stitcher')">봉합자 처치</button><button onclick="size(false)">PC</button><button onclick="size(true)">모바일</button><button onclick="capture()">아스트라 포획</button><button onclick="consume()">아리아 섭취</button></header>
<header><b>BOSS / QA</b><button onclick="bossPreview(1,0)">1세계 1보스</button><button onclick="bossPreview(1,1)">1세계 2보스</button><button onclick="bossPreview(1,2)">1세계 3보스</button><button onclick="bossPreview(3,0)">3세계 1보스</button><button onclick="bossPreview(3,1)">3세계 2보스</button><button onclick="bossPreview(3,2)">3세계 3보스</button><button onclick="bossPreview(2,2)">2세계 녹스</button><button onclick="defeatPreviewBoss()">보스 격파</button></header>
<header><button onclick="previewBossPattern(0)">보스 패턴 1</button><button onclick="previewBossPattern(1)">보스 패턴 2</button><button onclick="running=false;advance(75);paint()">75프레임 진행</button></header>
<canvas id="game"></canvas><section id="gallery" hidden></section><output id="status">Loading</output><output id="errors"></output>
<script>
// Isolated fixture: never read, overwrite, or clear the real player's saves.
const qaStorage=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>qaStorage.get(k)??null,setItem:(k,v)=>qaStorage.set(k,String(v)),removeItem:k=>qaStorage.delete(k)},configurable:true});
window.requestAnimationFrame=()=>0;let ready=false,running=false,phone=false,ticks=0;
addEventListener('error',e=>document.getElementById('errors').textContent+=e.message+'\n');
addEventListener('unhandledrejection',e=>document.getElementById('errors').textContent+=String(e.reason)+'\n');
function paint(){if(!ready)return;if(!document.getElementById('gallery').hidden)return;draw();document.getElementById('status').textContent=JSON.stringify({world:selectedWorld,screen:screenMode,phone,ticks,running,hp:player.hp,boss:activeRaidBoss?{name:typeof getRaidBossName==='function'?getRaidBossName(activeRaidBoss.raidIndex):RAID_BOSS_NAMES[activeRaidBoss.raidIndex],type:activeRaidBoss.worldRaidType,hp:activeRaidBoss.hp,pattern:activeRaidBoss.pattern,time:activeRaidBoss.patternTime}:null,victory:raidVictory,enemies:zombies.map(z=>({id:z.worldMonsterType||'world2',state:z.worldMonsterState,hp:Math.round(z.hp),x:Math.round(z.x),y:Math.round(z.y)})),projectiles:worldMonsterProjectiles.length,errors:document.getElementById('errors').textContent});}
function size(m){phone=m;canvas.width=m?844:1280;canvas.height=m?390:720;isMobileTouchDevice=()=>m;isMobilePortraitMode=()=>false;updateCamera();paint();}
function showCanvas(){document.getElementById('gallery').hidden=true;canvas.hidden=false;}
async function combat(world){if(!ready)return;running=false;showCanvas();selectedCharacter='zero';selectWorldStage(world,'easy');restart();screenMode='game';choosingUpgrade=false;paused=false;gameOver=false;raidVictory=false;player.level=10;player.hp=player.maxHp=1000;player.x=WORLD.width/2;player.y=WORLD.height/2;mouse.down=false;mouse.worldX=player.x+250;mouse.worldY=player.y;zombies=[];wave=8;ticks=0;
  if(world===2){for(let i=0;i<5;i++){spawnZombie();Object.assign(zombies.at(-1),{x:player.x+(i-2)*110,y:player.y-150});}}
  else{const definitions=Object.values(WORLD_MONSTER_TYPES).filter(d=>d.world===world);definitions.forEach((d,i)=>{const z=createWorldMonster(d.id,player.x+(i-2)*125,player.y-165);zombies.push(z);if(typeof relicTrackEnemy==='function')relicTrackEnemy(z);});}
  updateCamera();prepareGameImages();await Promise.all(gameImageRegistry.filter(i=>i.assetRequested).map(i=>i.decode().catch(()=>{})));paint();}
function advance(n){for(let i=0;i<n;i++){if(player.invincibleTime>0)player.invincibleTime--;if(activeRaidBoss)updateRaidBossSystem();updateZombies();updateWorldMonsterCombat();updateParticles();ticks++;}}
async function bossPreview(world,index){await combat(world);player.hp=player.maxHp=1000;startRaidBoss(index);raidIntroTime=0;player.x=activeRaidBoss.x+170;player.y=activeRaidBoss.y+90;updateCamera();prepareGameImages();await Promise.all(gameImageRegistry.filter(i=>i.assetRequested).map(i=>i.decode().catch(()=>{})));paint();}
function defeatPreviewBoss(){if(activeRaidBoss){const boss=activeRaidBoss;boss.hp=0;killZombie(zombies.indexOf(boss),boss);}paint();}
function previewBossPattern(pattern){running=false;if(activeRaidBoss?.isWorldRaidBoss){worldRaidZones.length=0;worldRaidProjectiles.length=0;startWorldRaidPattern(activeRaidBoss,pattern);}paint();}
function killType(id){const z=zombies.find(z=>z.worldMonsterType===id);if(z){z.hp=0;killZombie(zombies.indexOf(z),z);}paint();}
async function gallery(){running=false;canvas.hidden=true;const root=document.getElementById('gallery');root.hidden=false;root.innerHTML=Object.values(WORLD_MONSTER_TYPES).map(d=>`<figure><img src="${d.image}" alt="${d.name}"><figcaption>${d.name}<small>${d.world}세계 · ${d.id}</small></figcaption></figure>`).join('');await Promise.all([...root.querySelectorAll('img')].map(img=>img.decode().catch(()=>{})));document.getElementById('status').textContent='10종의 신규 투명 몬스터 원화';}
function guide(){running=false;showCanvas();openGuideScreen('monsters');paint();}
function capture(){running=false;selectedCharacter='astra';player.level=10;player.astraRCooldown=0;activateAstraR();for(let n=0;n<60;n++)updateAstra();paint();}
function consume(){running=false;selectedCharacter='aria';resetAriaRework();for(const z of [...zombies]){z.ariaWorldTreeKill=true;z.hp=0;killZombie(zombies.indexOf(z),z);}for(let n=0;n<18;n++)updateAria();paint();}
setInterval(()=>{if(ready){if(running&&screenMode==='game')advance(1);paint();}},1000/60);
(async()=>{const markup=await(await fetch('index.html?qa='+Date.now(),{cache:'no-store'})).text();const doc=new DOMParser().parseFromString(markup,'text/html');for(const old of doc.querySelectorAll('script[src]')){const src=old.getAttribute('src');if(src.includes('pwa.js')||src.includes('studio-intro.js'))continue;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src+(src.includes('?')?'&':'?')+'qa='+Date.now();s.onload=resolve;s.onerror=()=>reject(new Error(src));document.head.append(s);});}saveTotalKills=()=>{};ready=true;size(false);await combat(1);})();
</script></body></html>

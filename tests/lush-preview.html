<!doctype html><html lang="ko"><head><meta charset="utf-8"><base href="../"><title>LusH royal review</title><link rel="stylesheet" href="style.css"><style>html,body{height:auto;overflow:auto}body{margin:0;background:#140914;color:#ffe3ad;font:14px Arial}header{display:flex;flex-wrap:wrap;gap:6px;padding:8px}button{padding:8px 11px;background:#351322;color:#ffe4b4;border:1px solid #bc9654;border-radius:5px}canvas{display:block;max-width:100%;height:auto;margin:auto}output{display:block;padding:8px}#errors{color:#ff7c9d}</style></head><body>
<header><b>LusH · ROYAL REVIEW</b><button onclick="scene('home')">로비</button><button onclick="scene('q')">Q 카드</button><button onclick="scene('e')">E 주사위</button><button onclick="scene('x')">X 정산</button><button onclick="scene('r')">R 딜러</button><button onclick="scene('jackpot')">777</button><button onclick="scene('triple')">트리플</button><button onclick="scene('normal')">일반 결과</button><button onclick="scene('augments')">증강</button><button onclick="step(20)">20프레임</button><button onclick="step(120)">120프레임</button><button onclick="resizeReview(false)">PC</button><button onclick="resizeReview(true)">모바일</button><button onclick="toggleAnimation(this)">애니메이션</button><button onclick="profile()">성능 검사</button></header>
<canvas id="game" width="1280" height="760"></canvas><output id="status">Loading</output><output id="errors"></output><script>
const nativeRAF=requestAnimationFrame.bind(window);window.requestAnimationFrame=()=>0;let ready=false,phone=false,kind='home',animating=false;
addEventListener('error',e=>document.getElementById('errors').textContent+=e.message+'\n');addEventListener('unhandledrejection',e=>document.getElementById('errors').textContent+=String(e.reason)+'\n');
function report(extra=''){document.getElementById('status').textContent=JSON.stringify({kind,frame:lushState.frame,chips:lushState.chips,pot:lushState.pot,totalAssets:lushState.totalAssets,odds:lushOdds(),effects:lushState.effects.length,cards:lushState.cards.length,realm:lushState.realm,reels:lushState.ultimate?.reels})+' '+extra;}
function sizeReview(){const w=phone?844:1280,h=phone?390:760;if(canvas.width!==w)canvas.width=w;if(canvas.height!==h)canvas.height=h;updateCamera();}
function paint(){sizeReview();draw();report();}function step(n){for(let i=0;i<n;i++)updateLush();paint();}
function resizeReview(value){phone=value;isMobileTouchDevice=()=>value;isMobilePortraitMode=()=>false;if(ready)paint();}
function toggleAnimation(button){animating=!animating;button.textContent=animating?'애니메이션 정지':'애니메이션';let last=0,acc=0;function tick(now){if(!animating)return;acc+=Math.min(100,last?now-last:16.67);last=now;while(acc>=16.67){updateLush();acc-=16.67;}paint();nativeRAF(tick);}if(animating)nativeRAF(tick);}
function scene(value){if(!ready)return;kind=value;selectedCharacter='lush';restart();screenMode=value==='home'?'home':'game';player.level=10;player.hp=73;player.exp=4;player.expNeed=12;player.x=1700;player.y=1150;sizeReview();mouse.worldX=player.x+600;mouse.worldY=player.y-150;mouse.x=(mouse.worldX-camera.x)*getWorldViewScale();mouse.y=(mouse.worldY-camera.y)*getWorldViewScale();lushState.chips=20;lushState.totalAssets=150;for(let i=0;i<30;i++){const a=i*2.39996,r=200+i%6*55;zombies.push({x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r,r:18,hp:100000,maxHp:100000,speed:.9});}
 if(value==='q'){activateLushQ();step(24);}else if(value==='e'){activateLushE();step(48);}else if(value==='x'){lushState.pot=80;lushState.principal=20;activateLushX();step(24);}else if(value==='r'){activateLushR();step(40);activateLushQ();activateLushE();step(30);}else if(['jackpot','triple','normal'].includes(value)){activateLushR();lushState.ultimate.age=599;lushState.ultimate.reels=value==='jackpot'?[7,7,7]:value==='triple'?[2,2,2]:[1,2,3];lushState.realm=1;step(value==='jackpot'?56:32);}else if(value==='augments'){choosingUpgrade=true;upgradeChoices=upgrades.filter(u=>u.id.startsWith('lush')).slice(0,3);upgradeAnimTime=90;paint();}else paint();}
async function profile(){scene('r');lushState.totalAssets=750;for(let i=0;i<200;i++){const a=i*2.39996;zombies.push({x:player.x+Math.cos(a)*400,y:player.y+Math.sin(a)*400,r:18,hp:1000000,maxHp:1000000,speed:.9});}const times=[],updates=[],renders=[];for(let i=0;i<240;i++){if(i%23===0){player.fireCooldown=0;attackWithLush();}if(i%60===0){player.lushqCooldown=0;activateLushQ();}const t=performance.now();updateLush();const u=performance.now();draw();const d=performance.now();if(i>=60){times.push(d-t);updates.push(u-t);renders.push(d-u);}if(i%10===0)await new Promise(nativeRAF);}for(const a of [times,updates,renders])a.sort((a,b)=>a-b);report('230 enemies warm CPU median '+times[90].toFixed(2)+' ms p95 '+times[171].toFixed(2)+' ms; update p95 '+updates[171].toFixed(2)+'; draw p95 '+renders[171].toFixed(2));}
(async()=>{const html=await(await fetch('index.html?lushreview='+Date.now(),{cache:'no-store'})).text(),doc=new DOMParser().parseFromString(html,'text/html');for(const script of doc.querySelectorAll('script[src]')){const src=script.getAttribute('src');if(src.includes('pwa.js'))continue;await new Promise((resolve,reject)=>{const el=document.createElement('script');el.src=src+(src.includes('?')?'&':'?')+'review='+Date.now();el.onload=resolve;el.onerror=reject;document.head.append(el);});}saveTotalKills=()=>{};selectedCharacter='lush';screenMode='game';prepareGameImages();for(const image of gameImageRegistry.filter(i=>i.assetRequested))await image.decode().catch(()=>{});ready=true;resizeReview(false);scene('home');})();
</script></body></html>

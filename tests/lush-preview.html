<!doctype html><html lang="ko"><head><meta charset="utf-8"><base href="../"><title>LusH review</title><link rel="stylesheet" href="style.css"><style>html,body{height:auto;overflow:auto}body{margin:0;background:#140914;color:#ffe3ad;font:14px Arial}header{display:flex;flex-wrap:wrap;gap:7px;padding:8px}button{padding:8px 12px;background:#351322;color:#ffe4b4;border:1px solid #bc9654;border-radius:5px}canvas{display:block;max-width:100%;height:auto;margin:auto}output{display:block;padding:8px}#errors{color:#ff7c9d}</style></head><body>
<header><b>LusH · CASINO REVIEW</b><button onclick="scene('home')">로비</button><button onclick="scene('q')">Q 주사위</button><button onclick="scene('e')">E 베팅</button><button onclick="scene('x')">X 정산</button><button onclick="scene('r')">R 카지노</button><button onclick="scene('augments')">증강</button><button onclick="step(20)">20프레임</button><button onclick="step(120)">120프레임</button><button onclick="resizeReview(false)">PC</button><button onclick="resizeReview(true)">모바일</button><button onclick="profile()">성능 검사</button><button onclick="document.querySelector('header').style.display='none';scrollTo(0,0);paint()">게임 화면</button></header>
<canvas id="game" width="1280" height="760"></canvas><output id="status">Loading</output><output id="errors"></output><script>
const nativeRAF=requestAnimationFrame.bind(window);window.requestAnimationFrame=()=>0;let ready=false,phone=false,kind='home';
addEventListener('error',e=>document.getElementById('errors').textContent+=e.message+'\n');addEventListener('unhandledrejection',e=>document.getElementById('errors').textContent+=String(e.reason)+'\n');
function report(extra=''){document.getElementById('status').textContent=JSON.stringify({kind,frame:lushState.frame,chips:lushState.chips,pot:lushState.pot,odds:lushOdds(),effects:lushState.effects.length,realm:lushState.realm,reels:lushState.ultimate?.reels})+' '+extra;}
function paint(){draw();report();}function step(n){for(let i=0;i<n;i++)updateLush();paint();}
function resizeReview(value){phone=value;canvas.width=value?844:1280;canvas.height=value?390:760;isMobileTouchDevice=()=>value;isMobilePortraitMode=()=>false;updateCamera();if(ready)paint();}
function scene(value){if(!ready)return;kind=value;selectedCharacter='lush';restart();screenMode=value==='home'?'home':'game';player.level=10;player.hp=73;player.exp=4;player.expNeed=12;player.x=1700;player.y=1150;updateCamera();mouse.worldX=player.x+500;mouse.worldY=player.y-10;mouse.x=(mouse.worldX-camera.x)*getWorldViewScale();mouse.y=(mouse.worldY-camera.y)*getWorldViewScale();lushState.chips=20;for(let i=0;i<30;i++){const a=i*2.39996,r=200+i%6*50;zombies.push({x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r,r:18,hp:100000,maxHp:100000,speed:.9});}
 if(value==='q'){activateLushQ();step(38);}else if(value==='e'){lushState.ready=true;activateLushE();step(18);}else if(value==='x'){lushState.ready=true;lushState.pot=80;activateLushX();step(22);}else if(value==='r'){activateLushR();step(48);}else if(value==='augments'){choosingUpgrade=true;upgradeChoices=upgrades.filter(u=>u.id.startsWith('lush')).slice(0,3);upgradeAnimTime=90;paint();}else paint();}
async function profile(){scene('r');for(let i=0;i<6;i++)lushLaunchDie(3);for(let i=0;i<200;i++){const a=i*2.39996;zombies.push({x:player.x+Math.cos(a)*300,y:player.y+Math.sin(a)*300,r:18,hp:100000,maxHp:100000,speed:.9});}const times=[];for(let i=0;i<180;i++){const t=performance.now();updateLush();draw();times.push(performance.now()-t);if(i%10===0)await new Promise(nativeRAF);}times.sort((a,b)=>a-b);report('230 enemies CPU median '+times[90].toFixed(2)+' ms p95 '+times[171].toFixed(2)+' ms');}
(async()=>{const html=await(await fetch('index.html?lushreview='+Date.now(),{cache:'no-store'})).text(),doc=new DOMParser().parseFromString(html,'text/html');for(const script of doc.querySelectorAll('script[src]')){const src=script.getAttribute('src');if(src.includes('pwa.js'))continue;await new Promise((resolve,reject)=>{const el=document.createElement('script');el.src=src+(src.includes('?')?'&':'?')+'review='+Date.now();el.onload=resolve;el.onerror=reject;document.head.append(el);});}saveTotalKills=()=>{};selectedCharacter='lush';screenMode='game';prepareGameImages();for(const image of gameImageRegistry.filter(i=>i.assetRequested))await image.decode().catch(()=>{});ready=true;resizeReview(false);scene('home');})();
</script></body></html>

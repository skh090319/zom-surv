<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><base href="../"><title>Astra VFX review</title><link rel="stylesheet" href="style.css"><style>html,body{height:auto;overflow:auto}#game{background:transparent}</style>
<style>body{margin:0;background:#070c16;color:#d6e6f9;font:14px system-ui}header{padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}button{background:#182638;color:#e5edff;border:1px solid #46607e;border-radius:5px;padding:8px 12px;cursor:pointer}canvas{display:block;max-width:100%;height:auto;margin:auto}output{display:block;padding:8px 16px;white-space:pre-wrap;font:12px monospace}#errors{color:#ff9595}</style></head><body>
<header><strong>ASTRA · LOCAL VFX REVIEW</strong><button onclick="scene('q')">Q · Volley</button><button onclick="scene('e')">E · Gravity well</button><button onclick="scene('r')">R · Capture</button><button onclick="scene('fallback')">R · Boss only</button><button onclick="scene('stress')">250 enemies</button><button onclick="step(20)">+20 frames</button><button onclick="step(120)">+120 frames</button><button onclick="launchReview()">Release R</button><button onclick="togglePlay()">Play / Stop</button><button onclick="resizeReview(false)">Desktop</button><button onclick="resizeReview(true)">Phone</button><button onclick="benchmark()">Profile 180 frames</button><button onclick="fullGameReview()">Full game + movement</button></header>
<header><button onclick="scene('starter')">Starting augments</button><button onclick="scene('dust')">E · 100 stardust</button><button onclick="scene('growth')">Growth · 300 stardust</button><button onclick="scene('x',60)">X · Aurora</button><button onclick="scene('x',570)">X · Fold</button><button onclick="scene('r',350)">R · Constellation</button><button onclick="fullBenchmark()">Full loop profile</button></header>
<canvas id="game" width="1280" height="760"></canvas><output id="status">Loading production scripts…</output><output id="errors"></output><button onclick="saveReviewFrame()">Export review PNG</button><a id="download" hidden>Download review PNG</a>
<header id="constellations"><strong>REAL CONSTELLATIONS · FIXED PREVIEW</strong></header>
<header><button onclick="cancelReview('start')">Skill drag</button><button onclick="cancelReview('hover')">Hover cancel X</button><button onclick="cancelReview('end')">Release cancel X</button><button onclick="scene('dust',26)">E · Intake</button></header>
<header><strong>REALM TRANSITION</strong><button onclick="scene('r',0)">R · Start</button><button onclick="scene('r',18)">R · Ripple</button><button onclick="scene('r',27)">R · Fade in</button><button onclick="scene('r',180)">R · Realm</button><button onclick="scene('r',330)">R · Fade out</button><button onclick="scene('r',420)">R · Restored</button></header>
<script>
// Isolated test entry point: same production scripts and renderer, no PWA or saved progress writes.
const nativeRAF=window.requestAnimationFrame.bind(window);window.requestAnimationFrame=()=>0;
let reviewReady=false,reviewPhone=false,reviewPlay=false,reviewKind='q';
window.addEventListener('error',e=>document.getElementById('errors').textContent+=e.message+'\n');
window.addEventListener('unhandledrejection',e=>document.getElementById('errors').textContent+=String(e.reason)+'\n');
function report(extra=''){document.getElementById('status').textContent=JSON.stringify({scene:reviewKind,frame:astraFrame,realmProgress:astraBackdropProgress(),stars:astraQFlights().length,gravity:astraGravity?.state,constellation:astraGravity?.constellation?.name,bodies:astraGravity?.bodies.length,enemies:zombies.length,particles:astraDust.length,bursts:astraEffects.length,mobile:reviewPhone,viewport:[canvas.width,canvas.height],bossHP:activeRaidBoss?.hp,playerHP:player.hp})+' '+extra;}
function paint(){draw();report();}
function reviewTick(){updateAstra();updateGravityFields();updateParticles();}
function step(n){reviewPlay=false;for(let i=0;i<n;i++)reviewTick();paint();}
function launchReview(){launchAstraGravity();step(12);}
function constellationReview(index){scene('r',0);astraGravity.constellation=ASTRA_CONSTELLATIONS[index];step(350);}
function reviewTouch(type,x,y){const rect=canvas.getBoundingClientRect(),touch=new Touch({identifier:91,target:canvas,clientX:rect.left+x*rect.width/canvas.width,clientY:rect.top+y*rect.height/canvas.height});canvas.dispatchEvent(new TouchEvent(type,{bubbles:true,cancelable:true,changedTouches:[touch],touches:type==='touchend'?[]:[touch],targetTouches:type==='touchend'?[]:[touch]}));}
function cancelReview(phase){
  if(phase==='start'){resizeReview(true);scene('controls',0);const s=getMobileControlLayout().skills.find(s=>s.key==='e');reviewTouch('touchstart',s.x,s.y);reviewTouch('touchmove',s.x-40,s.y-10);}
  else{const c=getMobileSkillCancelButton();reviewTouch(phase==='end'?'touchend':'touchmove',c.x,c.y);}
  paint();report(`Skill drag=${Boolean(mobileSkillAim)}; cancel hover=${Boolean(mobileSkillAim?.cancelHover)}; E wells=${astraWells.length}; E cooldown=${player.astraECooldown}`);
}
function resizeReview(phone){reviewPhone=phone;canvas.width=phone?844:1280;canvas.height=phone?390:760;isMobileTouchDevice=()=>phone;updateCamera();paint();}
function fakeEnemy(x,y,i){return {x,y,r:i%5===0?27:18,hp:450,maxHp:450,speed:.9,boss:i%5===0,expValue:1,scoreValue:10};}
function scene(kind,age=100){
  if(!reviewReady)return;reviewPlay=false;reviewKind=kind;selectedCharacter='astra';restart();screenMode='game';if(kind==='starter'){upgradeAnimTime=90;paint();return;}finalizeUpgradeChoice(0);player.level=10;player.damage=35;player.astraBlueLevel=2;player.astraRedLevel=1;player.exp=1;player.expNeed=12;
  player.x=1700;player.y=1150;updateCamera();mouse.worldX=player.x+410;mouse.worldY=player.y-75;mouse.x=(mouse.worldX-camera.x)*getWorldViewScale();mouse.y=(mouse.worldY-camera.y)*getWorldViewScale();
  for(let i=0;i<(kind==='stress'?250:kind==='fallback'?0:20);i++){
    const a=i*2.39996,r=kind==='stress'?100+i%9*35:190+i%5*65;zombies.push(fakeEnemy(player.x+Math.cos(a)*r,player.y+Math.sin(a)*r,i));
  }
  if(kind==='q'){activateAstraQ();for(let i=0;i<20;i++)reviewTick();}
  else if(kind==='x'){activateAstraX();for(let i=0;i<age;i++)reviewTick();}
  else if(kind==='e'||kind==='dust'||kind==='growth'){player.astraStardust=kind==='growth'?300:kind==='dust'?100:0;if(kind!=='growth')activateAstraE();for(let i=0;i<age;i++){if(kind==='growth')player.x+=1;reviewTick();}}
  else if(kind!=='controls'){
    if(kind==='fallback'){
      startRaidBoss(0);activeRaidBoss.x=activeRaidBoss.anchorX=player.x+410;activeRaidBoss.y=activeRaidBoss.anchorY=player.y-75;raidIntroTime=0;raidBossEffects=[];particles=[];
      updateCamera();mouse.worldX=activeRaidBoss.x;mouse.worldY=activeRaidBoss.y;mouse.x=(mouse.worldX-camera.x)*getWorldViewScale();mouse.y=(mouse.worldY-camera.y)*getWorldViewScale();
    }
    activateAstraR();if(kind==='stress'){activateAstraE();activateAstraQ();activateAstraX();}for(let i=0;i<age;i++)reviewTick();
  }
  paint();
}
function togglePlay(){reviewPlay=!reviewPlay;if(reviewPlay)animate();}
function animate(){if(!reviewPlay)return;if(screenMode==='game')reviewTick();paint();nativeRAF(animate);}
function fullGameReview(){reviewPlay=false;const start=player.x;keys.d=true;for(let i=0;i<180;i++)update();keys.d=false;paint();report(`Full update: moved ${(player.x-start).toFixed(1)} world units; player HP ${player.hp}; gameOver=${gameOver}`);}
function saveReviewFrame(){reviewPlay=false;const link=document.getElementById('download');if(link.href.startsWith('blob:'))URL.revokeObjectURL(link.href);canvas.toBlob(blob=>{link.href=URL.createObjectURL(blob);link.download='astra-'+reviewKind+'-review.png';link.hidden=false;},'image/png');}
async function benchmark(){reviewPlay=false;if(reviewKind==='stress')scene('stress',150);const times=[];for(let i=0;i<180;i++){const t=performance.now();reviewTick();draw();times.push(performance.now()-t);if(i%10===0)await new Promise(nativeRAF);}times.sort((a,b)=>a-b);report(`CPU submission: median ${times[90].toFixed(2)} ms; p95 ${times[171].toFixed(2)} ms`);}
async function fullBenchmark(){
  scene('stress',0);player.astraStardust=300;player.hp=player.maxHp=100000;player.expNeed=1000000;
  for(const z of zombies)z.hp=z.maxHp=100000000;
  const times=[],intervals=[];let previous=await new Promise(nativeRAF);
  for(let i=0;i<360;i++){
    const stamp=await new Promise(nativeRAF);intervals.push(stamp-previous);previous=stamp;
    const t=performance.now();update();draw();times.push(performance.now()-t);
  }
  times.sort((a,b)=>a-b);intervals.sort((a,b)=>a-b);
  report(`FULL 250 enemies / 300 stardust / QEXR: CPU median ${times[180].toFixed(2)} ms p95 ${times[342].toFixed(2)} ms; RAF median ${intervals[180].toFixed(2)} ms p95 ${intervals[342].toFixed(2)} ms; gameOver=${gameOver}; choosingUpgrade=${choosingUpgrade}`);
}
(async()=>{
  const html=await(await fetch('index.html?astra-review='+Date.now(),{cache:'no-store'})).text(),doc=new DOMParser().parseFromString(html,'text/html');
  for(const original of doc.querySelectorAll('script[src]')){if(original.getAttribute('src').includes('pwa.js'))continue;await new Promise((resolve,reject)=>{const s=document.createElement('script'),src=original.getAttribute('src');s.src=src+(src.includes('?')?'&':'?')+'review='+Date.now();s.onload=resolve;s.onerror=reject;document.head.append(s);});}
  saveTotalKills=()=>{};isMobileTouchDevice=()=>reviewPhone;selectedCharacter='astra';screenMode='game';prepareGameImages();
  await Promise.all(gameImageRegistry.filter(img=>img.assetRequested).map(img=>img.decode().catch(()=>{})));
  for(const [i,shape] of ASTRA_CONSTELLATIONS.entries()){const button=document.createElement('button');button.textContent=shape.name;button.onclick=()=>constellationReview(i);document.getElementById('constellations').append(button);}
  reviewReady=true;resizeReview(false);scene('q');
})();
</script></body></html>
